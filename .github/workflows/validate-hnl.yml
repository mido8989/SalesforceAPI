name: Validate on hnlOrg

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Log in to hnlOrg
        run: |
          echo "${{ secrets.SFDX_AUTH_URL_HNL }}" > auth.txt
          sf org login sfdx-url --sfdx-url-file auth.txt --alias hnlOrg
          rm auth.txt

      - name: Validate deployment (no changes saved)
        run: sf project deploy validate --source-dir force-app --target-org hnlOrg --test-level RunLocalTests